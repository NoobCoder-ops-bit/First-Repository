<!DOCTYPE html>
<html>
<head>
    <title>ICT Web Portfolio - Gallery</title>
<style>
    :root {
        --navy: #102a43;
        --navy-dark: #091c2e;
        --blue: #1f5f78;
        --teal: #2d7d86;
        --teal-light: #75bfc1;
        --gold: #d8aa45;
        --gold-light: #f1d98a;
        --cream: #f7f5ef;
        --white: #ffffff;
        --ink: #18303d;
        --muted: #607580;
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        font-family: "Trebuchet MS", Verdana, sans-serif;
        color: var(--ink);
        line-height: 1.6;
        background-color: var(--cream);
        background-image:
            radial-gradient(rgba(16, 42, 67, 0.13) 1px, transparent 1px);
        background-size: 22px 22px;
        overflow-x: hidden;
    }

    /* HEADER */
    header {
        position: relative;
        min-height: 330px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 65px 25px;
        text-align: center;
        color: white;
        background:
            linear-gradient(
                135deg,
                var(--navy-dark) 0%,
                var(--navy) 45%,
                var(--blue) 75%,
                var(--teal) 100%
            );
        border-bottom: 5px solid var(--gold);
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(16, 42, 67, 0.20);
    }

    header::before {
        content: "";
        position: absolute;
        width: 230px;
        height: 230px;
        left: -85px;
        top: 50%;
        transform: translateY(-50%) rotate(15deg);
        border: 2px solid rgba(117, 191, 193, 0.25);
        background:
            linear-gradient(
                90deg,
                transparent 48%,
                rgba(117,191,193,0.18) 49%,
                rgba(117,191,193,0.18) 51%,
                transparent 52%
            ),
            linear-gradient(
                0deg,
                transparent 48%,
                rgba(117,191,193,0.18) 49%,
                rgba(117,191,193,0.18) 51%,
                transparent 52%
            );
        background-size: 35px 35px;
        opacity: 0.8;
    }

    header::after {
        content: "✦";
        position: absolute;
        right: 8%;
        top: 45%;
        transform: translateY(-50%);
        color: var(--gold);
        font-size: 55px;
        opacity: 0.75;
    }

    header h1 {
        position: relative;
        z-index: 2;
        margin: 0;
        font-family: "Arial Black", "Trebuchet MS", sans-serif;
        font-size: clamp(2.3rem, 6vw, 4.2rem);
        line-height: 1.05;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 4px 4px 0 rgba(0,0,0,0.25);
    }

    header h1::after {
        content: "";
        display: block;
        width: 65px;
        height: 4px;
        margin: 16px auto 0;
        background: var(--gold);
        border-radius: 10px;
    }

    header p {
        position: relative;
        z-index: 2;
        margin: 18px 0 0;
        padding: 7px 17px;
        color: var(--navy);
        background: var(--gold-light);
        border: 2px solid var(--gold);
        border-radius: 50px;
        font-size: 0.9rem;
        font-weight: bold;
        letter-spacing: 0.5px;
        box-shadow: 3px 3px 0 rgba(0,0,0,0.22);
    }

    /* NAVIGATION */
    nav {
        position: sticky;
        top: 0;
        z-index: 1000;
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        padding: 13px;
        background: rgba(16,42,67,0.97);
        border-bottom: 3px solid var(--gold);
        box-shadow: 0 5px 20px rgba(16,42,67,0.20);
        backdrop-filter: blur(10px);
    }

    nav a {
        position: relative;
        display: inline-block;
        padding: 7px 17px;
        color: white;
        text-decoration: none;
        font-weight: bold;
        border: 1px solid transparent;
        border-radius: 25px;
        transition: 0.25s ease;
    }

    nav a:hover {
        color: var(--gold-light);
        background: rgba(45,125,134,0.25);
        border-color: rgba(216,170,69,0.4);
        transform: translateY(-2px);
    }

    nav a::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 2px;
        width: 0;
        height: 3px;
        background: var(--gold);
        border-radius: 10px;
        transform: translateX(-50%);
        transition: width 0.25s ease;
    }

    nav a:hover::after {
        width: 55%;
    }

    /* Keep your gallery styles below */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 28px;
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 20px 35px;
    }

    .invitation-gallery {
        grid-template-columns: repeat(3, 1fr);
    }

    /* FIGURE / GALLERY CARDS */
    figure {
        position: relative;
        margin: 0;
        padding: 12px;
        background: var(--white);
        border: 2px solid rgba(45, 125, 134, 0.30);
        border-radius: 16px;
        box-shadow:
            6px 7px 0 rgba(216, 170, 69, 0.70),
            0 12px 25px rgba(16, 42, 67, 0.12);
        transition: 0.35s ease;
        overflow: hidden;
    }

    /* Teal top line */
    figure::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(
            90deg,
            var(--navy),
            var(--teal),
            var(--gold)
        );
    }

    /* Hover */
    figure:hover {
        transform: translateY(-8px) rotate(-1deg);
        box-shadow:
            9px 10px 0 var(--teal),
            0 18px 30px rgba(16, 42, 67, 0.18);
    }

    /* IMAGES */
    figure img {
        display: block;
        width: 100%;
        height: 230px;
        object-fit: cover;
        border-radius: 10px;
        transition: 0.4s ease;
    }

    figure:hover img {
        transform: scale(1.03);
    }

    /* Invitation images */
    section.gallery-grid + section[group="bread"] + section.gallery-grid figure img {
        height: 500px;
    }

    /* IMAGE TEXT */
    figure p {
        margin: 14px 4px 3px;
        color: var(--navy);
        font-size: 1rem;
        letter-spacing: 0.3px;
    }

    figure strong p {
        color: var(--blue);
    }

    /* SECTION HEADINGS */
    section[group="bread"] {
        text-align: center;
        padding: 35px 20px 15px;
    }

    section[group="bread"] h2 {
        display: inline-block;
        margin: 0 auto;
        text-align: center;
        color: var(--navy);
        font-size: clamp(1.5rem, 2.3vw, 2.2rem);
        letter-spacing: 0.5px;
    }

    /* VIDEO DESIGN */
    section:not(.gallery-grid) figure {
        max-width: 850px;
        margin: 25px auto;
    }

    figure video {
        display: block;
        width: 100%;
        max-height: 480px;
        object-fit: contain;
        border-radius: 10px;
        background: var(--navy-dark);
        border: 3px solid var(--teal);
        box-sizing: border-box;
    }

    /* Video captions */
    figure b p {
        color: var(--navy);
        font-size: 1rem;
        margin-top: 13px;
    }

    /* Hover effect for videos with border color */
    .video-card:hover {
        border-color: rgba(16, 42, 67, 0.12);
        box-shadow:
            0 0 0 2px rgba(16, 42, 67, 0.12),
            0 18px 30px rgba(16, 42, 67, 0.14);
    }

    .video-card:hover video {
        border-color: rgba(16, 42, 67, 0.12);
    }

    /* FOOTER */
    footer {
        position: relative;
        background:
            linear-gradient(
                120deg,
                var(--navy-dark),
                var(--navy),
                var(--blue)
            );
        color: white;
        text-align: center;
        padding: 28px 20px;
        margin-top: 50px;
        border-top: 5px solid var(--gold);
        overflow: hidden;
    }

    footer::after {
        content: "✦  ✦  ✦";
        position: absolute;
        top: 8px;
        right: 20px;
        color: var(--gold);
        opacity: 0.6;
        letter-spacing: 8px;
    }

    footer p {
        margin: 0;
        color: var(--gold-light);
        font-size: 0.9rem;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 800px) {

        header h1 {
            font-size: 2rem;
        }

        .invitation-gallery {
            grid-template-columns: repeat(2, 1fr);
        }

        .gallery-grid {
            gap: 20px;
        }
    }

    @media (max-width: 600px) {

        header {
            padding: 45px 16px 38px;
        }

        header h1 {
            font-size: 1.7rem;
            letter-spacing: 1px;
        }

        header::after {
            right: 4%;
            font-size: 35px;
        }

        nav {
            padding: 10px 5px;
        }

        nav a {
            margin: 3px;
            padding: 7px 10px;
            font-size: 0.85rem;
        }

        section[group="bread"] {
            padding: 35px 14px 15px;
        }

        h2 {
            font-size: 1.25rem;
            padding: 9px 12px;
            box-shadow:
                4px 4px 0 var(--gold),
                0 6px 15px rgba(16, 42, 67, 0.10);
        }

        h2::before,
        h2::after {
            display: none;
        }

        .gallery-grid,
        .invitation-gallery {
            grid-template-columns: 1fr;
            padding: 15px 14px 30px;
        }

        figure img {
            height: 250px;
        }

        section.gallery-grid + section[group="bread"] + section.gallery-grid figure img {
            height: 420px;
        }

        figure {
            box-shadow:
                5px 6px 0 rgba(216, 170, 69, 0.70),
                0 10px 20px rgba(16, 42, 67, 0.12);
        }
    }
</style>
